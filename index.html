
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYRO Fashion</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#fff;
color:#111;
}

header{
position:fixed;
top:0;
width:100%;
background:#fff;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
z-index:1000;
}

.logo{
font-size:32px;
font-weight:900;
letter-spacing:4px;
}

nav a{
text-decoration:none;
color:#111;
margin-left:25px;
font-weight:600;
}

.hero{
height:100vh;
background:url('https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
background-position:center;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

.hero-content{
background:rgba(0,0,0,.4);
padding:40px;
border-radius:12px;
}

.hero h1{
font-size:60px;
margin-bottom:15px;
}

.hero p{
font-size:20px;
margin-bottom:20px;
}

.hero button{
padding:15px 35px;
border:none;
background:white;
cursor:pointer;
font-weight:bold;
font-size:16px;
}

.section-title{
text-align:center;
font-size:40px;
margin:80px 0 40px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
padding:0 8% 80px;
}

.product{
background:white;
box-shadow:0 2px 15px rgba(0,0,0,.08);
}

.product img{
width:100%;
height:400px;
object-fit:cover;
}

.product-info{
padding:20px;
}

.product-info h3{
margin-bottom:10px;
}

.price{
font-size:20px;
font-weight:bold;
margin-bottom:15px;
}

.btn{
width:100%;
padding:14px;
background:black;
color:white;
border:none;
cursor:pointer;
}

.cart{
position:fixed;
bottom:20px;
right:20px;
background:black;
color:white;
padding:15px 20px;
border-radius:30px;
font-weight:bold;
}

footer{
background:#111;
color:white;
text-align:center;
padding:40px;
}
</style>
</head>

<body>

<header>
<div class="logo">ZYRO</div>

<nav>
<a href="#">Startseite</a>
<a href="#">Shop</a>
<a href="#">Neuheiten</a>
<a href="#">Kontakt</a>
</nav>
</header>

<section class="hero">
<div class="hero-content">
<h1>NEUE KOLLEKTION</h1>
<p>Modern. Stilvoll. Einzigartig.</p>
<button>Jetzt shoppen</button>
</div>
</section>

<h2 class="section-title">Beliebte Produkte</h2>

<section class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80">
<div class="product-info">
<h3>Premium T-Shirt</h3>
<p class="price">25 €</p>
<button class="btn" onclick="addToCart()">In den Warenkorb</button>
</div>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=800&q=80">
<div class="product-info">
<h3>Oversize Hoodie</h3>
<p class="price">49 €</p>
<button class="btn" onclick="addToCart()">In den Warenkorb</button>
</div>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=800&q=80">
<div class="product-info">
<h3>Urban Jacke</h3>
<p class="price">79 €</p>
<button class="btn" onclick="addToCart()">In den Warenkorb</button>
</div>
</div>

</section>

<div class="cart">
🛒 Warenkorb: <span id="count">0</span>
</div>

<footer>
<h3>ZYRO Fashion</h3>
<p>Schneller Versand in Deutschland und Europa</p>
<p>E-Mail: info@zyro.de</p>
<p>Instagram: @zyroshop</p>
</footer>

<script>
let count = 0;

function addToCart() {
  count++;
  document.getElementById("count").innerText = count;
}
</script>

</body>
</html>
